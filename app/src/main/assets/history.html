<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全部记忆 - Capsule Diary</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="icon" type="image/png" href="tx_circle.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .gallery-container {
        width: 100%;
        max-width: 95%; 
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .memory-waterfall {
        column-count: 2;    
        column-gap: 1rem;   
        width: 100%;
      }
      
      @media (min-width: 640px) {
        .memory-waterfall { column-count: 3; } 
      }
      @media (min-width: 1024px) {
        .memory-waterfall { column-count: 4; } 
      }
      @media (min-width: 1440px) {
        .memory-waterfall { column-count: 5; } 
      }

      .waterfall-item {
        break-inside: avoid;        
        margin-bottom: 1.2rem; 
        display: block;             
      }
    </style>
  </head>
  <body class="min-h-screen transition-all duration-300 antialiased py-8">
    <div class="gallery-container">
      <header class="flex justify-between items-center mb-8 backdrop-blur-md py-2 sticky top-0 z-50">
        <div class="flex items-center gap-3">
          <a href="index.html" class="w-9 h-9 rounded-xl flex items-center justify-center border border-gray-200/60 dark:border-gray-800/60 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:scale-105 active:scale-95 transition-all bg-white/40 dark:bg-gray-900/40 cursor-pointer" title="返回封装舱">
            <i class="fa-solid fa-arrow-left text-xs"></i>
          </a>
          <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-500 to-purple-600 bg-clip-text text-transparent flex items-center">
            <i class="fa-solid fa-images mr-2.5 text-sm opacity-90"></i>全部记忆
          </h1>
        </div>

        <div class="flex items-center gap-2 p-1 bg-gray-100/80 dark:bg-gray-900/80 rounded-2xl border border-gray-200/50 dark:border-gray-800/50 backdrop-blur-md theme-bar-container">
          <button id="theme-light" data-theme="light" class="w-8 h-8 rounded-xl flex items-center justify-center text-xs opacity-60 hover:opacity-100 transition-all cursor-pointer"><i class="fa-solid fa-sun text-amber-500"></i></button>
          <button id="theme-dark" data-theme="dark" class="w-8 h-8 rounded-xl flex items-center justify-center text-xs opacity-60 hover:opacity-100 transition-all cursor-pointer"><i class="fa-solid fa-moon text-indigo-400"></i></button>
          <button id="theme-green" data-theme="green" class="w-8 h-8 rounded-xl flex items-center justify-center text-xs opacity-60 hover:opacity-100 transition-all cursor-pointer"><i class="fa-solid fa-leaf text-emerald-500"></i></button>
          <button id="theme-purple" data-theme="purple" class="w-8 h-8 rounded-xl flex items-center justify-center text-xs opacity-60 hover:opacity-100 transition-all cursor-pointer"><i class="fa-solid fa-wand-magic-sparkles text-purple-500"></i></button>
        </div>
      </header>

      <main>
        <div id="memoryGallery" class="memory-waterfall">
          <div id="galleryLoading" class="w-full text-center py-24 text-gray-400">
            <i class="fa-solid fa-circle-notch animate-spin text-xl mr-2"></i>正在拼接破碎的记忆卷轴...
          </div>
        </div>
      </main>
    </div>
    <script src="history.js"></script>
  </body>
</html>
